name: Stylehub Deloyment

on:
  push: 
    branches: [production]

jobs:
  deloy:
    runs-on: ubuntu-latest
    steps:
      - name: Deloy using ssh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSOWRD }}
          port: 22
          script: |
            cd /home/web-Stylehub
            git fetch origin
            git checkout production
            git pull
            npm install
            npm run build
            pm2 reload web-clothe 
